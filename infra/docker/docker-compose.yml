version: "3.9"

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 (OLTP)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ups-postgres
    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups_secret
      POSTGRES_DB: ups_eco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d ups_eco"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ups-net

  # ------------------------------------------------------------
  # Redis (cache + locks)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ups-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ups-net

  # ------------------------------------------------------------
  # Kafka (KRaft mode, без Zookeeper)
  # ------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: ups-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ups-net

  # ------------------------------------------------------------
  # MinIO (S3-compatible)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ups-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: upsminio
      MINIO_ROOT_PASSWORD: upsminio_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ups-net

  # ------------------------------------------------------------
  # ClickHouse (OLAP)
  # ------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: ups-clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_USER: ups
      CLICKHOUSE_PASSWORD: ups_secret
      CLICKHOUSE_DB: ups_analytics
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ups-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  clickhouse_data:

networks:
  ups-net:
    driver: bridge
